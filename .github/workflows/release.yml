name: Release

on: workflow_dispatch

permissions:
   contents: read

concurrency:
   group: release
   cancel-in-progress: false

jobs:
   gate:
      if: github.ref == 'refs/heads/main'
      runs-on: ubuntu-24.04
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
              fetch-depth: 0
         - name: Refuse a released version
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              tag="v$(node -p "require('./apps/desktop/package.json').version")"
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "::error::$tag already has a release; bump the version"
                exit 1
              fi
              if git rev-parse -q --verify "refs/tags/$tag" >/dev/null && [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
                echo "::error::$tag already tags another commit; bump the version"
                exit 1
              fi
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
              cache: npm
         - name: Pin npm 12
           run: npm install -g npm@12
         - name: Enforce install-script allowlist
           run: npm config set strict-allow-scripts=true --location=project
         - run: npm ci
         - run: npm run check
         - run: npm run unit
         - run: npm run integration --if-present

   build:
      needs: gate
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: windows-latest
                 platform: win32
                 arch: x64
               - os: ubuntu-24.04
                 platform: linux
                 arch: x64
               - os: macos-15
                 platform: darwin
                 arch: arm64
      runs-on: ${{ matrix.os }}
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
         - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
           with:
              node-version: 24
              cache: npm
         - name: Pin npm 12
           run: npm install -g npm@12
         - name: Enforce install-script allowlist
           run: npm config set strict-allow-scripts=true --location=project
         - run: npm ci
         - name: Allow the Chromium sandbox on Ubuntu 24.04
           if: runner.os == 'Linux'
           run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
         - name: Start the dev loop
           if: runner.os != 'Windows'
           shell: bash
           run: |
              case "$RUNNER_OS" in
                macOS) start=(npm start) ;;
                Linux) start=(xvfb-run -a npm start) ;;
              esac
              "${start[@]}" &
              pid=$!
              for _ in $(seq 180); do
                pgrep -f node_modules/electron/dist >/dev/null && break
                if ! kill -0 "$pid"; then
                  echo "::error::npm start exited before Electron launched"
                  exit 1
                fi
                sleep 1
              done
              sleep 5
              pgrep -f node_modules/electron/dist
              pkill -f -- electron-forge
              pkill -f -- node_modules/electron/dist || true
         - run: npm run build
         - name: Launch the packaged app
           shell: bash
           working-directory: apps/desktop
           run: |
              product="$(node -p "require('./package.json').productName")"
              directory="out/$product-${{ matrix.platform }}-${{ matrix.arch }}"
              case "$RUNNER_OS" in
                Windows) app=("$directory/$product.exe") ;;
                macOS) app=("$directory/$product.app/Contents/MacOS/$product") ;;
                Linux) app=(xvfb-run -a "$directory/$product") ;;
              esac
              "${app[@]}" &
              pid=$!
              sleep 5
              kill -0 "$pid"
              if [ "$RUNNER_OS" = Linux ]; then pkill -f -- "$directory/$product"; else kill "$pid"; fi
         - name: Collect release files
           shell: bash
           working-directory: apps/desktop
           run: |
              name=tetris-trainer
              version="$(node -p "require('./package.json').version")"
              product="$(node -p "require('./package.json').productName")"
              archive="$PWD/out/release/$name-$version-${{ matrix.platform }}-${{ matrix.arch }}.zip"
              mkdir -p out/release
              case "$RUNNER_OS" in
                Windows)
                  cp "out/make/$name-Setup-$version-${{ matrix.arch }}.exe" out/release/
                  7z a "$archive" "./out/$product-${{ matrix.platform }}-${{ matrix.arch }}"
                  ;;
                macOS) ditto -c -k --keepParent "out/$product-${{ matrix.platform }}-${{ matrix.arch }}" "$archive" ;;
                Linux) (cd out && zip -qry "$archive" "$product-${{ matrix.platform }}-${{ matrix.arch }}") ;;
              esac
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           with:
              name: release-${{ matrix.platform }}-${{ matrix.arch }}
              retention-days: 7
              path: apps/desktop/out/release/*
              if-no-files-found: error

   publish:
      needs: build
      runs-on: ubuntu-24.04
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
           with:
              persist-credentials: false
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
           with:
              pattern: release-*
              path: artifacts
         - name: Publish an unreleased version
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              tag="v$(node -p "require('./apps/desktop/package.json').version")"
              if [ "$(find artifacts -mindepth 1 -maxdepth 1 -type d -name 'release-*' | wc -l)" -ne 3 ]; then
                echo "::error::a platform's release files are missing; dispatch the release again"
                exit 1
              fi
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "::notice::$tag already exists; skipping"
                exit 0
              fi
              gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes artifacts/*/*
